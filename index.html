<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Open the link, Atha 💌</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--cherry:#6b1325;--wine:#2e0610;--cream:#fbf1e0;--blush:#f7c9d0;--gold:#c9a45c;--ink:#5a1a26;--serif:'Playfair Display',Georgia,serif;--hand:'Caveat','Segoe Script',cursive;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:radial-gradient(circle at 50% 25%,#80192d,var(--wine) 80%);color:var(--cream);font-family:var(--serif)}
#root{height:100%}
.scr{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;overflow:hidden;animation:fin .8s ease both}
@keyframes fin{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.stars{position:absolute;inset:0;background-image:radial-gradient(2px 2px at 12% 20%,#fff8,transparent),radial-gradient(2px 2px at 80% 12%,#fff8,transparent),radial-gradient(1.5px 1.5px at 40% 70%,#fff7,transparent),radial-gradient(2px 2px at 90% 60%,#fff8,transparent),radial-gradient(1.5px 1.5px at 22% 88%,#fff7,transparent),radial-gradient(2px 2px at 60% 35%,#fff6,transparent);animation:tw 3s infinite alternate}
@keyframes tw{to{opacity:.4}}
.fl{position:absolute;bottom:-40px;animation:rise linear forwards;pointer-events:none;opacity:.8}
@keyframes rise{to{transform:translateY(-115vh) rotate(25deg);opacity:0}}
.hand{font-family:var(--hand);font-weight:700}
.btn{font-family:var(--serif);font-weight:700;letter-spacing:.04em;border:0;border-radius:40px;padding:14px 26px;font-size:clamp(14px,4vw,17px);cursor:pointer;background:var(--cream);color:var(--cherry);box-shadow:0 6px 0 #c9a45c,0 12px 24px #0006;transition:transform .15s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #c9a45c}
.btn.pink{background:#e8577a;color:#fff;box-shadow:0 6px 0 #a42b4b,0 12px 24px #0005}
.zen{z-index:2;position:relative}
/* intro */
.intro{background:repeating-linear-gradient(90deg,#fde3e6 0 22px,#fff6e8 22px 44px);color:var(--cherry)}
.intro h1{font-family:var(--hand);font-size:clamp(32px,9vw,58px);line-height:1.1;margin:10px 0 28px;max-width:560px}
.intro .row{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;align-items:center;min-height:120px}
.intro .deco{position:absolute;font-size:34px;animation:bob 3s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-10px) rotate(8deg)}}
.intro .msg{font-family:var(--hand);font-size:26px;min-height:36px;margin-top:20px}
.nob{transition:transform .35s cubic-bezier(.3,1.6,.5,1);background:#fff;color:#8a5560;box-shadow:0 6px 0 #d9b9be,0 10px 20px #0002}
/* envelope */
.env{position:relative;width:min(80vw,330px);height:min(52vw,214px);margin:70px 0 36px;background:#e6cba4;border-radius:6px;box-shadow:0 20px 40px #0008}
.env .ltr{position:absolute;left:7%;right:7%;bottom:7%;height:85%;background:var(--cream);z-index:1;transition:transform 1.1s .7s ease;padding:14px;font-family:var(--hand);color:var(--ink);font-size:22px;border-radius:3px}
.env.open .ltr{transform:translateY(-62%)}
.env .front{position:absolute;inset:0;background:#f1dcba;clip-path:polygon(0 100%,0 0,50% 55%,100% 0,100% 100%);z-index:2;border-radius:6px}
.env .flap{position:absolute;top:0;left:0;right:0;height:56%;background:#e9cf9f;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .8s ease,z-index 0s .4s;z-index:3}
.env.open .flap{transform:rotateX(180deg);z-index:0}
.seal{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:50px;height:50px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8fb0,#d94672);z-index:4;display:grid;place-items:center;font-size:24px;box-shadow:0 3px 8px #0006;transition:opacity .4s}
.env.open .seal{opacity:0}
.lines{font-family:var(--hand);font-size:clamp(22px,6vw,30px);margin:6px 0}
/* card */
.card{position:relative;background:var(--cream);color:var(--ink);width:min(92vw,440px);padding:42px 28px 30px;border-radius:8px;box-shadow:0 20px 50px #000a;border:2px dashed var(--gold);outline:8px solid var(--cream);animation:flip 1s ease both}
@keyframes flip{from{transform:perspective(900px) rotateY(-90deg);opacity:0}to{transform:none;opacity:1}}
.card h2{font-size:clamp(24px,7vw,34px);margin:6px 0 14px;color:#a31f3d;letter-spacing:.04em}
.card p{font-family:var(--hand);font-size:clamp(21px,5.6vw,26px);line-height:1.25;margin:0 0 22px}
.tape{position:absolute;top:-14px;left:50%;width:110px;height:28px;background:#f3c9b3cc;transform:translateX(-50%) rotate(-3deg)}
.cd{position:absolute;font-size:30px}
.film{width:min(92vw,440px);height:44px;margin-top:26px;background:#111;border-radius:4px;background-image:repeating-linear-gradient(90deg,#111 0 10px,#fff9 10px 18px,#111 18px 28px);display:flex;align-items:center;justify-content:space-around;font-size:22px}
/* letter */
.desk{background:radial-gradient(circle at 50% 40%,#7b2233,#3a0a15 85%)}
.closed{position:relative;width:min(78vw,300px);height:190px;background:#f1dcba;border-radius:6px;box-shadow:0 18px 40px #000a;margin:20px 0 28px;transform:rotate(-3deg);display:grid;place-items:center}
.closed:before{content:"";position:absolute;inset:0;background:#e9cf9f;clip-path:polygon(0 0,100% 0,50% 58%);border-radius:6px}
.wax{position:relative;width:62px;height:62px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d8334f,#7e0f25);display:grid;place-items:center;font-size:28px;margin-top:-30px;box-shadow:0 4px 10px #0007}
.paper{background:var(--cream);color:var(--ink);width:min(94vw,520px);max-height:84vh;overflow:auto;padding:28px 24px;border-radius:4px;box-shadow:0 20px 50px #000a;text-align:left;transform-origin:top;animation:unf 1.2s ease both;background-image:repeating-linear-gradient(transparent 0 31px,#e7d3c5 31px 32px)}
@keyframes unf{from{transform:scaleY(.05);opacity:0}to{transform:none;opacity:1}}
.paper .t{font-family:var(--hand);font-size:clamp(21px,5.4vw,26px);line-height:32px;white-space:pre-wrap;min-height:200px}
.cur:after{content:"|";animation:bl .7s infinite}
@keyframes bl{50%{opacity:0}}
.pop{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;background:repeating-linear-gradient(90deg,#d6e6f5 0 22px,#fff6ee 22px 44px);animation:popin .7s cubic-bezier(.3,1.5,.5,1) both;overflow:hidden}
@keyframes popin{from{transform:scale(.2);opacity:0}to{transform:none;opacity:1}}
.pop .hb{font-family:var(--hand);font-weight:700;color:#e0587c;font-size:clamp(64px,22vw,130px);line-height:.9;transform:rotate(-4deg);text-shadow:3px 3px 0 #fff,0 6px 0 #f4b6c4;position:relative;z-index:2}
.pop .hb small{display:block;font-size:.85em;margin-top:-4px}
.pop .cast{font-size:clamp(46px,14vw,80px);margin:26px 0 8px;z-index:2;display:flex;gap:6px;align-items:flex-end}
.pop .cast span{animation:bob 1.6s ease-in-out infinite alternate}
.pop .sub{font-family:var(--hand);font-size:26px;color:var(--cherry);margin-bottom:18px;z-index:2}
.gifts{display:flex;gap:14px;justify-content:center;margin:18px 0}
.gift{width:min(26vw,104px);aspect-ratio:1;font-size:clamp(40px,12vw,58px);background:var(--cream);border:2px dashed var(--gold);border-radius:10px;cursor:pointer;box-shadow:0 8px 18px #0006;transition:transform .2s}
.gift:hover{transform:rotate(-4deg) scale(1.05)}
.gift.on{background:var(--blush);transform:translateY(-8px) rotate(3deg)}
.note{background:var(--cream);color:var(--ink);width:min(90vw,380px);min-height:130px;padding:18px 20px;border-radius:4px;box-shadow:0 12px 30px #0008;margin-bottom:22px;font-family:var(--hand);font-size:clamp(21px,5.6vw,25px);line-height:1.2;display:flex;flex-direction:column;justify-content:center;animation:fin .5s both}
.note b{font-family:var(--serif);font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:#a31f3d;margin-bottom:6px}
.ln{stroke:#ffd98a;stroke-width:1.6;stroke-dasharray:200;animation:dr .8s forwards;filter:drop-shadow(0 0 4px #ffd98a)}
@keyframes dr{from{stroke-dashoffset:200}to{stroke-dashoffset:0}}
.st{animation:tw 1.4s infinite alternate;transition:font-size .3s}
.st.on{animation:none;filter:drop-shadow(0 0 7px #ffd98a)}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:420px;margin:6px 0 14px}
.chips span{font-family:var(--hand);font-size:19px;background:#ffd98a22;border:1px solid #ffd98a88;color:#ffe7b0;border-radius:20px;padding:1px 12px;animation:fin .5s both}
.pol{background:#fff;padding:12px 12px 6px;box-shadow:0 14px 34px #000a;transform:rotate(var(--r));animation:pin .6s cubic-bezier(.3,1.4,.5,1) both;position:relative;width:min(68vw,290px);cursor:pointer;margin:14px 0 10px}
.pol img{display:block;width:100%;height:min(44vh,360px);object-fit:cover;object-position:50% 30%}
.pol .cap{font-family:var(--hand);color:#6b1325;font-size:26px;padding:8px 0 2px}
.pol .tp{position:absolute;top:-14px;left:50%;width:90px;height:26px;background:#f3c9b3cc;transform:translateX(-50%) rotate(-4deg)}
@keyframes pin{from{transform:translateY(-60px) rotate(calc(var(--r) + 14deg));opacity:0}to{transform:rotate(var(--r));opacity:1}}
.tiny{font-family:var(--hand);font-size:18px;opacity:.75;margin-top:10px;cursor:pointer;background:none;border:0;color:inherit;text-decoration:underline}
</style></head>
<body><div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>

<script>
const {useState,useEffect,useMemo}=React;
const html=htm.bind(React.createElement);
const SYM=['♡','💗','✨','🤍','🎀','⭐'];
function Hearts({n=14,dark=true}){
  const items=useMemo(()=>Array.from({length:n},(_,i)=>({l:Math.random()*100,d:Math.random()*4,t:6+Math.random()*6,s:14+Math.random()*22,c:SYM[i%SYM.length]})),[n]);
  return html`<div style=${{position:'absolute',inset:0,overflow:'hidden',pointerEvents:'none'}}>${items.map((h,i)=>html`<span key=${i} className="fl" style=${{left:h.l+'%',animationDelay:h.d+'s',animationDuration:h.t+'s',fontSize:h.s,color:dark?'#ffb3c4':'#e8577a'}}>${h.c}</span>`)}</div>`;
}
function Intro({go}){
  const [no,setNo]=useState(0),[pos,setPos]=useState([0,0]),[burst,setBurst]=useState(false),[pop,setPop]=useState(false);
  const msgs=['','Ayyoo Athayaaa, just one little surprise? 🥺💗','Pleaseee? I made it with so much love 🥹','Okay okay… my heart says YES, so tap it 💗'];
  const yes=()=>{setBurst(true);setPop(true)};
  const dodge=()=>{
    if(no>=3){yes();return}
    setNo(no+1);const a=Math.min(innerWidth*.22,120);
    setPos([(Math.random()-.5)*2*a,(Math.random()-.5)*100]);
  };
  return html`<div className="scr intro">
    ${['🎀','💗','⭐','🌸','✨'].map((e,i)=>html`<span key=${i} className="deco" style=${{left:[6,82,12,76,45][i]+'%',top:[8,10,80,78,4][i]+'%',animationDelay:i*.4+'s'}}>${e}</span>`)}
    <h1 className="zen">Athayaaa, ready for your little birthday surprise? 🥹💗</h1>
    <div className="row zen">
      <button className="btn pink" onClick=${yes}>YESSS, SHOW ME! 💌</button>
      <button className="btn nob" style=${{transform:`translate(${pos[0]}px,${pos[1]}px)`}} onClick=${dodge}>${no>=3?'Okay, YES 💗':'NO 🙈'}</button>
    </div>
    <div className="msg zen">${msgs[no]}</div>
    ${burst&&html`<${Hearts} n=${40} dark=${false}/>`}
    ${pop&&html`<div className="pop"><${Hearts} n=${24} dark=${false}/>
      <div className="hb">♡ happy<small>Birthday ♡</small></div>
      <div className="cast"><span>🐻</span><span style=${{animationDelay:'.2s'}}>🎂</span><span style=${{animationDelay:'.4s'}}>🐱</span></div>
      <div className="sub">for the sweetest Athayaaa ⭐💗</div>
      <button className="btn pink" style=${{zIndex:2}} onClick=${go}>CONTINUE 💌</button></div>`}
  </div>`;
}
function Envelope({go}){
  const [open,setOpen]=useState(false);
  const click=()=>{setOpen(true);setTimeout(go,3000)};
  return html`<div className="scr"><div className="stars"/><${Hearts}/>
    <div className="lines zen">pssst… I made something for you ♡</div>
    <div className={'env zen'+(open?' open':'')}>
      <div className="ltr">Open me, Athayaaa… 💗</div>
      <div className="front"/><div className="flap"/><div className="seal">💗</div>
    </div>
    <div className="lines zen" style=${{maxWidth:420}}>It’s not just a birthday wish. It’s a little piece of my heart.</div>
    <button className="btn zen" style=${{marginTop:14}} disabled=${open} onClick=${click}>OPEN YOUR SURPRISE 💌</button>
    ${open&&html`<${Hearts} n=${30}/>`}
  </div>`;
}
function Card({go}){
  return html`<div className="scr"><div className="stars"/><${Hearts} n=${8}/>
    <div className="card zen"><div className="tape"/>
      <span className="cd" style=${{left:10,top:8}}>🌸</span><span className="cd" style=${{right:10,top:8}}>🎀</span>
      <span className="cd" style=${{left:10,bottom:6}}>🌷</span><span className="cd" style=${{right:10,bottom:6}}>💗</span>
      <h2>HAPPY BIRTHDAY, ATHAYAAA ♡</h2>
      <p>Today is all about you, my favourite person. And because one simple birthday message could never express how much you mean to me, I made you something a little more special.</p>
      <button className="btn pink" onClick=${go}>THERE’S MORE… →</button>
    </div>
    <div className="film zen">${['📷','🤍','📷','💗','📷'].map((e,i)=>html`<span key=${i}>${e}</span>`)}</div>
  </div>`;
}
const GIFTS=[['🎀','A wish for you','May every day this year feel as warm as the love you give to everyone around you.'],['🤗','Coupon','Good for ONE big hug from your kodalu. Valid forever, no expiry date 💗'],['💌','A little secret','You are one of the best things that ever happened to me. Happy Birthday ♡']];
function Gifts({go}){
  const [o,setO]=useState(null),[k,setK]=useState(0);
  return html`<div className="scr desk"><div className="stars"/><${Hearts} n=${8}/>
    ${k>0&&html`<${Hearts} key=${k} n=${18}/>`}
    <div className="lines zen">Three little surprises… pick one 🎁</div>
    <div className="gifts zen">${GIFTS.map((g,i)=>html`<button key=${i} className=${'gift'+(o===i?' on':'')} onClick=${()=>{setO(i);setK(k+1)}}>${o===i?g[0]:'🎁'}</button>`)}</div>
    <div className="note zen" key=${o}>${o===null?html`<span>tap a gift to open it 💗</span>`:html`<b>${GIFTS[o][1]}</b><span>${GIFTS[o][2]}</span>`}</div>
    <button className="btn zen" onClick=${go}>ON TO MY LETTER 💌</button>
  </div>`;

function Mem({go}){
  const [i,setI]=useState(0);
  const last=i===PHOTOS.length-1;
  return html`<div className="scr"><div className="stars"/><${Hearts} n=${10}/>
    <div className="lines zen">Memories of you 📷</div>
    <div className="pol zen" key=${i} style=${{'--r':[-4,3,-2][i%3]+'deg'}} onClick=${()=>!last&&setI(i+1)}>
      <div className="tp"/><img src=${PHOTOS[i]} alt=""/><div className="cap">${CAP[i]}</div></div>
    <div className="chips zen">${PHOTOS.map((_,k)=>html`<span key=${k} style=${{opacity:k===i?1:.35}}>♡</span>`)}</div>
    ${last?html`<button className="btn pink zen" onClick=${go}>ONE MORE SURPRISE ✨</button>`:html`<button className="btn zen" onClick=${()=>setI(i+1)}>NEXT →</button>`}
  </div>`;
}
const PT=[[150,248],[95,190],[55,135],[62,80],[105,55],[150,98],[195,55],[238,80],[245,135],[205,190]];
const TR=['Kind','Caring','Patient','Always there','A beautiful heart','Supportive','Loved','Valued','Appreciated','Our everything'];
function Sky({go}){
  const [lit,setLit]=useState([]),[last,setLast]=useState(null);
  const tap=i=>{if(!lit.includes(i))setLit([...lit,i]);setLast(i)};
  const all=lit.length===PT.length;
  return html`<div className="scr"><div className="stars"/>${all&&html`<${Hearts} n=${24}/>`}
    <div className="lines zen">Light up Athayaaa’s stars ✨</div>
    <svg className="zen" viewBox="0 0 300 280" style=${{width:'min(86vw,360px)',overflow:'visible'}}>
      ${PT.map((p,i)=>{const j=(i+1)%PT.length,q=PT[j];return lit.includes(i)&&lit.includes(j)?html`<line key=${'l'+i} x1=${p[0]} y1=${p[1]} x2=${q[0]} y2=${q[1]} className="ln"/>`:null})}
      ${PT.map((p,i)=>html`<g key=${i} onClick=${()=>tap(i)} style=${{cursor:'pointer'}}><circle cx=${p[0]} cy=${p[1]} r="22" fill="transparent"/><text x=${p[0]} y=${p[1]+9} textAnchor="middle" fontSize=${lit.includes(i)?32:22} fill=${lit.includes(i)?'#ffd98a':'#ffffff77'} className=${lit.includes(i)?'st on':'st'}>★</text></g>`)}
    </svg>
    <div className="lines zen" style=${{minHeight:40}}>${last===null?'tap a star':all?'You are our brightest star, Athayaaa 💗':TR[last]+' ✨'}</div>
    <div className="chips zen">${lit.map(i=>html`<span key=${i}>${TR[i]}</span>`)}</div>
    ${all?html`<button className="btn zen" onClick=${go}>ON TO MY LETTER 💌</button>`:html`<button className="tiny zen" onClick=${go}>skip →</button>`}
  </div>`;
}
const LETTER=`Athayaaaaaaaa 🥹💗❤️

Thank you for everything you’ve given us, for loving us more than we could ever ask for, and for making us feel so special in ways you probably don’t even realise.

I honestly don’t know how to put everything I feel for you into words. All I know is that you’re one of the most special people in my life, and I’m so lucky to have youuuu. ❤️🫂

Athayaaa, you are truly one of the best people in my life — so kind, caring, patient, and always there for us whenever we need you. You have such a beautiful heart, and I hope you know how deeply loved, valued, and appreciated you are. I feel so lucky to have you in my life. 🥹💗

Thank you for always supporting us and standing by our side, Athayaaa. Your love, care, and patience mean more to us than words can ever explain. And I’m truly sorry for all the times we’ve troubled you or given you extra worries. Thank you for being there for us through everything and for loving us so patiently. We’re so lucky to have you. 🥺🫂💗

And Athayaaa, I promise you one thing… one day, I’ll make you proud. I want you to look at me and feel happy and proud. I want to give you so many reasons to smile, just like you’ve given me so many reasons to feel loved. ❤️

Thank you for everything. Thank you for loving us the way you do. I miss you more than I can explain, and I love you more than these words can ever say.

Happiest birthday to my sweetest Athayaaa! 🎂🎀❤️

May this new year of your life bring you endless happiness, peaceful days, beautiful surprises, fulfilled dreams, and countless reasons to smile. You deserve all the love and happiness in this world, today and always. 🫶🏻✨

Sending you all my hugs, kisses, and love. 🫂💋

Love you loadssss, Athayaaa! ❤️

Forever your kodalluuu ♡`;

function Letter({restart}){
  const [open,setOpen]=useState(false),[n,setN]=useState(0);
  useEffect(()=>{
    if(!open)return;
    const id=setInterval(()=>setN(x=>{if(x>=LETTER.length){clearInterval(id);return x}return x+1}),22);
    return()=>clearInterval(id);
  },[open]);
  const done=n>=LETTER.length;
  useEffect(()=>{const p=document.querySelector('.paper');if(p)p.scrollTop=p.scrollHeight},[n]);
  return html`<div className="scr desk"><div className="stars"/><${Hearts} n=${10}/>
    ${!open?html`<div className="zen" style=${{display:'flex',flexDirection:'column',alignItems:'center'}}>
      <div className="lines">There’s something I’ve wanted you to know…</div>
      <div className="closed"><div className="wax">♡</div></div>
      <button className="btn" onClick=${()=>setOpen(true)}>OPEN MY LETTER 💌</button></div>`
    :html`<div className="paper zen"><div className=${'t'+(done?'':' cur')}>${LETTER.slice(0,n)}</div>
      ${!done?html`<button className="tiny" onClick=${()=>setN(LETTER.length)}>show it all</button>`
      :html`<button className="tiny" onClick=${restart}>read the surprise again 💗</button>`}</div>`}
  </div>`;
}
function App(){
  const [s,setS]=useState(0);const next=()=>setS(x=>x+1);
  return [html`<${Intro} go=${next}/>`,html`<${Envelope} go=${next}/>`,html`<${Card} go=${next}/>`,html`<${Mem} go=${next}/>`,html`<${Sky} go=${next}/>`,html`<${Letter} restart=${()=>setS(0)}/>`][s];
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
